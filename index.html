<body>
  <div id="root"></div>
  <script>
    // Storage polyfill
    window.storage = {
      get: async (key) => {
        const v = localStorage.getItem('detectio_' + key);
        if (v === null) throw new Error('Key not found');
        return { key, value: v };
      },
      set: async (key, value) => {
        localStorage.setItem('detectio_' + key, String(value));
        return { key, value };
      },
      delete: async (key) => {
        localStorage.removeItem('detectio_' + key);
        return { key, deleted: true };
      },
      list: async (prefix) => {
        const keys = Object.keys(localStorage)
          .filter(k => k.startsWith('detectio_' + (prefix||'')))
          .map(k => k.replace('detectio_',''));
        return { keys };
      }
    };
  </script>
  <script type="text/babel">

const FONTS = `@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap');`;

// ── Fournisseurs IA ───────────────────────────────────────────────────────────
const PROVIDERS = [
  { id:"claude",   name:"Claude",   company:"Anthropic",  icon:"🔮", color:"#00d4ff", model:"claude-sonnet-4-20250514", keyHint:"sk-ant-..." },
  { id:"gpt",      name:"GPT-4o",   company:"OpenAI",     icon:"🟢", color:"#10a37f", model:"gpt-4o",                   keyHint:"sk-..." },
  { id:"gemini",   name:"Gemini",   company:"Google",     icon:"💎", color:"#4285f4", model:"gemini-1.5-pro",           keyHint:"AIza..." },
  { id:"mistral",  name:"Mistral",  company:"Mistral AI", icon:"🌊", color:"#ff6b35", model:"mistral-large-latest",     keyHint:"..." },
  { id:"gptzero",  name:"GPTZero",  company:"Bursting (spécialisé IA)", icon:"🎯", color:"#a855f7", model:"v2/predict/text", keyHint:"gptzero-...", specialist:true },
];

const SYSTEM_PROMPT = `Expert forensique en détection de textes générés par IA. Réponds UNIQUEMENT en JSON valide sans backticks ni commentaires:
{"score":<0-100>,"verdict":"<Certitude très faible|Certitude faible|Certitude élevée|Certitude très élevée>","ai_probable":"<ChatGPT (OpenAI)|Claude (Anthropic)|Gemini (Google)|Mistral AI|Llama (Meta)|Indéterminé|Humain>","ai_confidence":<0-100>,"probable_prompt":"<prompt probable ou null>","language":"<Français 🇫🇷|Anglais 🇬🇧|Espagnol 🇪🇸|Autre>","style_markers":["m1","m2","m3"],"indices":["r1","r2","r3"]}`;

// ── Appels API par fournisseur ────────────────────────────────────────────────
async function callClaude(text, key) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},
    body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:800,
      system: SYSTEM_PROMPT,
      messages:[{role:"user",content:`Analyse:\n\n${text}`}] })
  });
  const d = await r.json();
  if(d.error) throw new Error("Claude: "+d.error.message);
  return JSON.parse(d.content.filter(b=>b.type==="text").map(b=>b.text).join("").replace(/```json|```/g,"").trim());
}

async function callGPT(text, key) {
  const r = await fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
    body:JSON.stringify({ model:"gpt-4o", max_tokens:800,
      messages:[{role:"system",content:SYSTEM_PROMPT},{role:"user",content:`Analyse:\n\n${text}`}] })
  });
  const d = await r.json();
  if(d.error) throw new Error("GPT: "+d.error.message);
  return JSON.parse(d.choices[0].message.content.replace(/```json|```/g,"").trim());
}

async function callGemini(text, key) {
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${key}`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ contents:[{ parts:[{ text: SYSTEM_PROMPT+"\n\nAnalyse:\n\n"+text }] }] })
  });
  const d = await r.json();
  if(d.error) throw new Error("Gemini: "+d.error.message);
  const raw = d.candidates[0].content.parts[0].text;
  return JSON.parse(raw.replace(/```json|```/g,"").trim());
}

async function callMistral(text, key) {
  const r = await fetch("https://api.mistral.ai/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
    body:JSON.stringify({ model:"mistral-large-latest", max_tokens:800,
      messages:[{role:"system",content:SYSTEM_PROMPT},{role:"user",content:`Analyse:\n\n${text}`}] })
  });
  const d = await r.json();
  if(d.error) throw new Error("Mistral: "+d.error.message);
  return JSON.parse(d.choices[0].message.content.replace(/```json|```/g,"").trim());
}

const API_CALLS = { claude:callClaude, gpt:callGPT, gemini:callGemini, mistral:callMistral, gptzero:callGPTZero };

async function callGPTZero(text, key) {
  const r = await fetch("https://api.gptzero.me/v2/predict/text", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key},
    body:JSON.stringify({ document:text })
  });
  const d = await r.json();
  if(d.error||d.status==="error") throw new Error("GPTZero: "+(d.error||d.message||"Erreur API"));
  const doc = d.documents?.[0] || d;
  const rawScore = doc.completely_generated_prob ?? doc.average_generated_prob ?? 0;
  const score = Math.min(Math.round(rawScore * 100), 100);
  const burstiness = doc.overall_burstiness?.toFixed(1) ?? "N/A";
  const avgGenProb = ((doc.average_generated_prob||0)*100).toFixed(1);
  const completeProb = ((doc.completely_generated_prob||0)*100).toFixed(1);
  const sentCount = doc.sentences?.length ?? 0;
  return {
    score,
    verdict: scoreLabel(score),
    ai_probable: "Indéterminé (GPTZero spécialisé)",
    ai_confidence: score,
    probable_prompt: null,
    language: "Indéterminé",
    style_markers: [
      `Burstiness : ${burstiness}`,
      "Détecteur spécialisé IA",
      `${sentCount} phrases analysées`
    ],
    indices: [
      `Probabilité générée complètement : ${completeProb}%`,
      `Probabilité moyenne générée : ${avgGenProb}%`,
      `Score burstiness (variance stylistique) : ${burstiness}`,
      `Nombre de phrases analysées : ${sentCount}`
    ]
  };
}

// ── Analyse locale gratuite ───────────────────────────────────────────────────
function analyzeLocal(text) {
  const sentences=text.split(/[.!?]+/).filter(s=>s.trim().length>4);
  const words=text.toLowerCase().match(/\b[a-záàâäéèêëîïôöùûüçœæ\w]+\b/g)||[];
  if(words.length<30) return null;
  const avgLen=words.length/Math.max(sentences.length,1);
  const s1=avgLen>17&&avgLen<36?22:5;
  const unique=new Set(words).size, diversity=unique/words.length;
  const s2=diversity<0.52?24:diversity<0.63?12:4;
  const aiP=["il est important","en conclusion","en résumé","il convient","par ailleurs","néanmoins","cependant","tout d'abord","ainsi","de plus","en outre","it is important","in conclusion","furthermore","however","overall","in summary"];
  const low=text.toLowerCase(), matches=aiP.filter(p=>low.includes(p)).length;
  const s3=Math.min(matches*9,28);
  const lens=sentences.map(s=>s.trim().split(/\s+/).length);
  const mean=lens.reduce((a,b)=>a+b,0)/lens.length;
  const variance=lens.reduce((a,b)=>a+Math.pow(b-mean,2),0)/lens.length;
  const s4=variance<18?18:variance<35?9:2;
  const score=Math.min(Math.max(s1+s2+s3+s4,5),92);
  const frW=["le","la","les","de","du","des","un","une","et","est","dans","pour"];
  const enW=["the","and","is","are","was","were","this","that","with","from"];
  const lang=frW.filter(w=>words.includes(w)).length>enW.filter(w=>words.includes(w)).length?"Français 🇫🇷":"Anglais 🇬🇧";
  return { score, verdict:scoreLabel(score), ai_probable:"Analyse heuristique", ai_confidence:0,
    probable_prompt:null, language:lang, style_markers:["Analyse heuristique · mode gratuit"],
    indices:[`Longueur moy. des phrases : ${avgLen.toFixed(1)} mots`,`Diversité lexicale : ${(diversity*100).toFixed(0)}%`,`Marqueurs IA détectés : ${matches}`,`Variance des phrases : ${variance.toFixed(1)}`] };
}

// ── Plans ─────────────────────────────────────────────────────────────────────
const PLANS = [
  { id:"unit",      label:"À l'unité",   price:"1,99€",  sub:"par analyse",              credits:1,     badge:null,               color:C.cyan,   icon:"🔍", unlimited:false },
  { id:"pack10",    label:"Pack 10",     price:"3,99€",  sub:"soit 0,40€ / analyse",     credits:10,    badge:"−80%",             color:C.green,  icon:"📦", unlimited:false },
  { id:"sub200",    label:"200 / mois",  price:"9,99€",  sub:"abonnement mensuel",        credits:200,   badge:"Populaire",        color:C.purple, icon:"⚡", unlimited:false },
  { id:"sub500",    label:"500 / mois",  price:"19,99€", sub:"abonnement mensuel",        credits:500,   badge:"Meilleure valeur", color:C.yellow, icon:"🚀", unlimited:false },
  { id:"unlimited", label:"Illimité",    price:"39,99€", sub:"abonnement mensuel · ∞",    credits:99999, badge:"∞ Sans limite",    color:C.red,    icon:"♾️", unlimited:true  },
];

// ── Composants ────────────────────────────────────────────────────────────────
function ScoreArc({score, size=140}){
  const col=scoreColor(score), r=54*(size/140), cx=size/2, cy=size*0.5,
    circ=2*Math.PI*r, arc=circ*0.75, filled=arc*(score/100), offset=circ*0.125;
  return(
    <svg width={size} height={size*0.79} style={{overflow:"visible"}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.border} strokeWidth="10" strokeDasharray={`${arc} ${circ-arc}`} strokeDashoffset={-offset} strokeLinecap="round"/>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={col} strokeWidth="10" strokeDasharray={`${filled} ${circ-filled}`} strokeDashoffset={-offset} strokeLinecap="round" style={{filter:`drop-shadow(0 0 8px ${col})`,transition:"stroke-dasharray 1s ease"}}/>
      <text x={cx} y={cy-4} textAnchor="middle" fill={col} style={{fontSize:28*(size/140),fontFamily:"'Syne',sans-serif",fontWeight:800}}>{score}%</text>
      <text x={cx} y={cy+18*(size/140)} textAnchor="middle" fill={C.dim} style={{fontSize:10,fontFamily:"'DM Mono',monospace"}}>CERTITUDE IA</text>
    </svg>
  );
}

function Bdg({label,value,color}){

    <div style={{background:"#0a1420",border:`1px solid ${color||C.border}22`,borderRadius:8,padding:"10px 14px",display:"flex",flexDirection:"column",gap:3}}>
      <span style={{fontSize:9,color:C.muted,letterSpacing:1,textTransform:"uppercase"}}>{label}</span>

}

function Stars({value,onChange}){

    <div style={{display:"flex",gap:8,alignItems:"center"}}>
      {[1,2,3,4,5].map(i=>(
        <button key={i} onClick={()=>onChange(i)} style={{background:"none",border:"none",cursor:"pointer",padding:4,fontSize:26,opacity:i<=value?1:0.2,filter:i<=value?`drop-shadow(0 0 6px ${C.star})`:"none",transition:"all .2s"}}>★</button>
      ))}
      {value>0&&<span style={{fontSize:13,color:C.star,fontFamily:"'Syne',sans-serif",fontWeight:700,marginLeft:4}}>{value}<span style={{fontSize:10,color:C.muted,fontWeight:400}}> / 5</span></span>}
    </div>

}

function CreditBar({current,total,color}){
  return(
    <div style={{background:"#0a1117",borderRadius:4,height:5,overflow:"hidden",marginTop:8}}>
      <div style={{height:"100%",width:`${Math.min((current/total)*100,100)}%`,background:color,borderRadius:4,transition:"width .6s ease",boxShadow:`0 0 6px ${color}88`}}/>
    </div>
  );
}

function BackBtn({onClick}){
  return <button onClick={onClick} style={{background:"#0d1117",border:`1px solid ${C.border}`,color:C.dim,borderRadius:10,padding:"8px 14px",fontSize:12,cursor:"pointer",fontFamily:"'DM Mono',monospace",flexShrink:0}}>← Retour</button>;
}

function Spinner({color}){
  return <span style={{width:13,height:13,border:`2px solid ${color||C.cyan}44`,borderTopColor:color||C.cyan,borderRadius:"50%",display:"inline-block",animation:"spin .8s linear infinite"}}/>;
}

// ── App ───────────────────────────────────────────────────────────────────────
function Detectia(){
  const [screen,setScreen]=useState("home");
  const [mode,setMode]=useState("free");
  const [plan,setPlan]=useState(null);
  const [credits,setCredits]=useState(0);
  const [text,setText]=useState("");
  const [result,setResult]=useState(null);      // single result
  const [crossResults,setCrossResults]=useState({}); // {providerId: result|"loading"|"error"}
  const [analysisMode,setAnalysisMode]=useState("single"); // single|cross
  const [selectedProvider,setSelectedProvider]=useState("claude");
  const [apiKeys,setApiKeys]=useState({}); // {providerId: key}
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [rating,setRating]=useState(0);
  const [comment,setComment]=useState("");
  const [feedbacks,setFeedbacks]=useState([]);
  const [showHint,setShowHint]=useState(false);
  const [buySuccess,setBuySuccess]=useState(false);
  const [keyVisibility,setKeyVisibility]=useState({});
  const [testStatus,setTestStatus]=useState({});
  const longTimer=useRef(null);

  useEffect(()=>{
    (async()=>{
      try{
        const fb=await window.storage.get("detectia-feedbacks"); if(fb) setFeedbacks(JSON.parse(fb.value));
        const pl=await window.storage.get("detectia-plan"); if(pl){ const d=JSON.parse(pl.value); setPlan(d); setCredits(d.credits||0); }
        const keys=await window.storage.get("detectia-keys"); if(keys) setApiKeys(JSON.parse(keys.value));
      }catch{}
    })();
  },[]);

  const saveKeys=async(k)=>{ setApiKeys(k); try{ await window.storage.set("detectia-keys",JSON.stringify(k)); }catch{} };
  const wc=(text.match(/\b\S+\b/g)||[]).length;
  const cp=PLANS.find(p=>p.id===plan?.id);
  const configuredProviders=PROVIDERS.filter(p=>apiKeys[p.id]?.trim());

  const onTouchStart=()=>{
    longTimer.current=setTimeout(()=>{
      const sel=window.getSelection?.()?.toString?.()||"";
      if(sel.length>20){ setText(sel); setShowHint(true); setTimeout(()=>setShowHint(false),3000); }
    },600);
  };

  const buyPlan=async(p)=>{
    const d={...p,credits:p.credits}; setPlan(d); setCredits(p.credits);
    try{ await window.storage.set("detectia-plan",JSON.stringify(d)); }catch{}
    setBuySuccess(true);
    setTimeout(()=>{ setBuySuccess(false); setMode("premium"); setScreen("analyze"); },2000);
  };

  const testKey=async(pid)=>{
    const key=apiKeys[pid]; if(!key) return;
    setTestStatus(s=>({...s,[pid]:"testing"}));
    try{
      await API_CALLS[pid]("This is a test sentence to verify the API key works correctly.", key);
      setTestStatus(s=>({...s,[pid]:"ok"}));
    }catch(e){ setTestStatus(s=>({...s,[pid]:"error"})); }
  };

  // Analyse unique
  const analyzeSingle=useCallback(async()=>{
    setError(""); setResult(null);
    if(wc<30){ setError("⚠️ Minimum 30 mots requis."); return; }
    if(mode==="premium"&&credits<=0){ setError("❌ Plus de crédits disponibles."); return; }
    setLoading(true);
    try{
      let r;
      if(mode==="free"){ r=analyzeLocal(text); if(!r){ setError("Texte non analysable."); setLoading(false); return; } }
      else{
        const key=apiKeys[selectedProvider];
        if(!key){ setError(`Clé API ${PROVIDERS.find(p=>p.id===selectedProvider)?.name} manquante. Configurez-la dans les paramètres.`); setLoading(false); return; }
        r=await API_CALLS[selectedProvider](text,key);
        r._provider=selectedProvider;
        const nc=credits-1; setCredits(nc);
        try{ await window.storage.set("detectia-plan",JSON.stringify({...plan,credits:nc})); }catch{}
      }
      setResult(r); setScreen("result"); setRating(0); setComment("");
    }catch(e){ setError("Erreur : "+(e.message||"Vérifiez votre clé API.")); }
    finally{ setLoading(false); }
  },[mode,text,credits,plan,selectedProvider,apiKeys,wc]);

  // Cross-analyse (tous les fournisseurs configurés)
  const analyzeCross=useCallback(async()=>{
    setError(""); setCrossResults({});
    if(wc<30){ setError("⚠️ Minimum 30 mots requis."); return; }
    if(configuredProviders.length<2){ setError("Configurez au moins 2 clés API dans les paramètres pour la cross-analyse."); return; }
    const cost=configuredProviders.length;
    if(credits<cost){ setError(`❌ La cross-analyse avec ${cost} IA nécessite ${cost} crédits (vous en avez ${credits}).`); return; }
    setLoading(true);
    const init={};
    configuredProviders.forEach(p=>{ init[p.id]="loading"; });
    setCrossResults({...init});
    setScreen("cross");
    let usedCredits=0;
    await Promise.all(configuredProviders.map(async(p)=>{
      try{
        const r=await API_CALLS[p.id](text,apiKeys[p.id]);
        r._provider=p.id;
        setCrossResults(prev=>({...prev,[p.id]:r}));
        usedCredits++;
      }catch(e){
        setCrossResults(prev=>({...prev,[p.id]:{error:e.message||"Erreur"}}));
      }
    }));
    const nc=credits-usedCredits; setCredits(nc);
    try{ await window.storage.set("detectia-plan",JSON.stringify({...plan,credits:nc})); }catch{}
    setLoading(false);
  },[text,credits,plan,configuredProviders,apiKeys,wc]);

  const analyze=()=>analysisMode==="cross"?analyzeCross():analyzeSingle();

  const saveFeedback=async()=>{
    if(!rating) return;
    const entry={id:Date.now(),date:new Date().toLocaleDateString("fr-FR"),score:result?.score,verdict:result?.verdict,ai:result?.ai_probable,mode,provider:result?._provider||"local",rating,comment};
    const upd=[entry,...feedbacks].slice(0,100);
    setFeedbacks(upd); try{ await window.storage.set("detectia-feedbacks",JSON.stringify(upd)); }catch{}
    setScreen("home"); setText(""); setResult(null);
  };

  const col=result?scoreColor(result.score):C.cyan;
  const providerInfo=result?._provider?PROVIDERS.find(p=>p.id===result._provider):null;

  // ── HOME ────────────────────────────────────────────────────────────────────
  if(screen==="home") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px 80px",fontFamily:"'DM Mono',monospace"}}>
      <style>{FONTS}{G}</style>
      <div style={{width:"100%",maxWidth:440,paddingTop:52,animation:"fadeUp .6s ease"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:32,fontWeight:800,color:C.cyan,letterSpacing:-1,lineHeight:1}}>DETECTIA</div>
            <div style={{fontSize:10,color:C.muted,letterSpacing:3,marginTop:4}}>FORENSIQUE IA · ANALYSE TEXTUELLE</div>
          </div>
          <button onClick={()=>setScreen("settings")} style={{background:"#0a1520",border:`1px solid ${C.border}`,borderRadius:12,width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,cursor:"pointer"}}>⚙️</button>
        </div>
        <div style={{height:1,background:`linear-gradient(to right,transparent,${C.cyan}44,transparent)`,margin:"18px 0"}}/>

        {/* Fournisseurs configurés */}
        {configuredProviders.length>0&&(
          <div style={{background:"#0a1018",border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>IA configurées</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {configuredProviders.map(p=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:6,background:`${p.color}15`,border:`1px solid ${p.color}44`,borderRadius:20,padding:"4px 10px"}}>
                  <span style={{fontSize:12}}>{p.icon}</span>
                  <span style={{fontSize:10,color:p.color,fontFamily:"'DM Mono',monospace"}}>{p.name}</span>
                </div>
              ))}
              {configuredProviders.length===0&&<span style={{fontSize:11,color:C.muted}}>Aucune clé configurée</span>}
            </div>
          </div>
        )}

        {/* Solde crédits */}
        {credits>0&&cp&&(
          <div style={{background:`${cp.color}0d`,border:`1px solid ${cp.color}33`,borderRadius:14,padding:"14px 16px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:9,color:cp.color,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>{cp.icon} {cp.label}</div>
                <div style={{fontSize:11,color:C.dim}}>{credits} crédit{credits>1?"s":""} disponible{credits>1?"s":""}</div>
              </div>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,color:cp.color}}>{credits}</div>
            </div>
            <CreditBar current={credits} total={cp.credits} color={cp.color}/>
          </div>
        )}

        <div style={{fontSize:11,color:C.muted,letterSpacing:2,marginBottom:12,textTransform:"uppercase"}}>Mode d'analyse</div>

        {[
          {id:"free",icon:"🆓",title:"Mode Gratuit",sub:"Analyse heuristique locale — sans crédits",col:C.green,
           feats:["Score de certitude IA","Identification probable","Détection de langue","Instantané & gratuit"]},
          {id:"premium",icon:"⚡",title:"Mode Premium",sub:credits>0?`${credits} crédit${credits>1?"s":""} dispo.`:"Analyse IA haute précision",col:C.cyan,
           feats:["Précision maximale","IA identifiée","Prompt reconstruit","Cross-analyse multi-IA 🆕"]}
        ].map(m=>(
          <div key={m.id} onClick={()=>{ if(m.id==="premium"&&credits<=0){ setScreen("pricing"); return; } setMode(m.id); setScreen("analyze"); }}
            style={{background:C.card,border:`1px solid ${m.col}44`,borderRadius:16,padding:"18px 20px",marginBottom:12,cursor:"pointer",transition:"transform .15s,box-shadow .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 8px 28px ${m.col}18`}}
            onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
              <span style={{fontSize:26}}>{m.icon}</span>
              <div><div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:700,color:m.col}}>{m.title}</div>
                <div style={{fontSize:10,color:C.muted}}>{m.sub}</div></div>
              <div style={{marginLeft:"auto",color:m.col,fontSize:18}}>→</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
              {m.feats.map((f,i)=><div key={i} style={{fontSize:10,color:C.dim,display:"flex",gap:5,alignItems:"center"}}><span style={{color:m.col,fontSize:8}}>■</span>{f}</div>)}
            </div>
          </div>
        ))}

        <button onClick={()=>setScreen("pricing")} style={{width:"100%",padding:"14px",background:`linear-gradient(135deg,${C.cyan}18,${C.purple}18)`,border:`1px solid ${C.cyan}55`,color:C.cyan,borderRadius:12,fontSize:13,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:700,letterSpacing:1,marginBottom:10}}>
          💳 VOIR LES FORFAITS
        </button>
        {feedbacks.length>0&&(
          <button onClick={()=>setScreen("history")} style={{width:"100%",background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:12,padding:"12px",fontSize:12,cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>
            📊 Historique des analyses ({feedbacks.length})
          </button>
        )}
        <div style={{marginTop:18,background:"#0a1118",border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px"}}>
          <div style={{fontSize:10,color:C.cyan,letterSpacing:2,marginBottom:6}}>💡 ASTUCE PWA</div>
          <div style={{fontSize:11,color:C.dim,lineHeight:1.7}}>Installez Detectia sur votre écran d'accueil puis sélectionnez n'importe quel texte → <span style={{color:C.text}}>"Partager"</span> → <span style={{color:C.cyan}}>Detectia</span>.</div>
        </div>
      </div>
    </div>
  );

  // ── SETTINGS ────────────────────────────────────────────────────────────────
  if(screen==="settings") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px 80px",fontFamily:"'DM Mono',monospace"}}>
      <style>{FONTS}{G}</style>
      <div style={{width:"100%",maxWidth:440,paddingTop:48,animation:"fadeUp .5s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
          <BackBtn onClick={()=>setScreen("home")}/>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:700,color:C.text}}>Paramètres IA</div>
        </div>
        <div style={{fontSize:11,color:C.muted,marginBottom:22,marginTop:8,lineHeight:1.6}}>
          Configurez vos clés API pour chaque fournisseur. Elles sont stockées localement sur votre appareil.
        </div>

        {PROVIDERS.map((p,i)=>{
          const k=apiKeys[p.id]||"";
          const vis=keyVisibility[p.id];
          const ts=testStatus[p.id];
          return(
            <div key={p.id} style={{background:C.card,border:`1px solid ${k?p.color+"44":C.border}`,borderRadius:16,padding:"18px",marginBottom:12,animation:`fadeUp ${.3+i*.07}s ease`}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <div style={{width:38,height:38,borderRadius:10,background:`${p.color}18`,border:`1px solid ${p.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{p.icon}</div>
                <div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:15,fontWeight:700,color:p.color,display:"flex",alignItems:"center",gap:6}}>{p.name}{p.specialist&&<span style={{fontSize:8,background:`${p.color}22`,color:p.color,padding:"2px 7px",borderRadius:10,letterSpacing:1}}>SPÉCIALISÉ</span>}</div>
                  <div style={{fontSize:10,color:C.muted}}>{p.company} · {p.model}</div>
                </div>
                {k&&<div style={{marginLeft:"auto",fontSize:18}}>{ts==="ok"?"✅":ts==="error"?"❌":"🔑"}</div>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <input type={vis?"text":"password"} value={k}
                  onChange={e=>saveKeys({...apiKeys,[p.id]:e.target.value})}
                  placeholder={p.keyHint}
                  style={{flex:1,background:"#07090f",color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:11,fontFamily:"'DM Mono',monospace"}}/>
                <button onClick={()=>setKeyVisibility(v=>({...v,[p.id]:!v[p.id]}))}
                  style={{background:"#0a1420",border:`1px solid ${C.border}`,color:C.dim,borderRadius:8,padding:"0 12px",cursor:"pointer",fontSize:14,flexShrink:0}}>
                  {vis?"🙈":"👁"}
                </button>
              </div>
              {k&&(
                <button onClick={()=>testKey(p.id)} disabled={ts==="testing"}
                  style={{width:"100%",marginTop:10,padding:"9px",background:`${p.color}10`,border:`1px solid ${p.color}33`,color:p.color,borderRadius:8,fontSize:11,cursor:"pointer",fontFamily:"'DM Mono',monospace",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  {ts==="testing"?<><Spinner color={p.color}/> Test en cours…</>
                    :ts==="ok"?"✅ Clé valide"
                    :ts==="error"?"❌ Clé invalide — réessayer"
                    :"🔍 Tester la clé"}
                </button>
              )}
            </div>
          );
        })}

        <div style={{background:"#0a1018",border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",marginTop:6}}>
          <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:8}}>🔒 CONFIDENTIALITÉ</div>
          <div style={{fontSize:11,color:C.dim,lineHeight:1.7}}>Vos clés API ne quittent jamais votre appareil. Elles sont stockées localement et transmises directement aux API des fournisseurs.</div>
        </div>
      </div>
    </div>
  );

  // ── ANALYZE ─────────────────────────────────────────────────────────────────
  if(screen==="analyze") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px 80px",fontFamily:"'DM Mono',monospace"}}>
      <style>{FONTS}{G}</style>
      <div style={{width:"100%",maxWidth:440,paddingTop:48,animation:"fadeUp .5s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <BackBtn onClick={()=>setScreen("home")}/>
          <div style={{display:"flex",gap:6,flex:1}}>
            {[{id:"free",label:"🆓 Gratuit",col:C.green},{id:"premium",label:"⚡ Premium",col:C.cyan}].map(m=>(
              <button key={m.id} onClick={()=>{ if(m.id==="premium"&&credits<=0){ setScreen("pricing"); return; } setMode(m.id); }}
                style={{flex:1,padding:"9px",borderRadius:10,background:mode===m.id?`${m.col}20`:"transparent",border:`1px solid ${mode===m.id?m.col:C.border}`,color:mode===m.id?m.col:C.muted,fontSize:11,cursor:"pointer",fontFamily:"'DM Mono',monospace",transition:"all .2s"}}>
                {m.label}
              </button>
            ))}
          </div>
          {mode==="premium"&&credits>0&&cp&&(
            <div style={{fontSize:11,color:cp.color,fontFamily:"'Syne',sans-serif",fontWeight:700,whiteSpace:"nowrap"}}>{credits} cr.</div>
          )}
        </div>

        {/* Sélection fournisseur (mode premium) */}
        {mode==="premium"&&(
          <div style={{marginBottom:14,animation:"fadeUp .3s ease"}}>
            {/* Mode : simple ou cross */}
            <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>Mode d'analyse</div>
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              {[{id:"single",label:"🎯 Simple",sub:"1 IA"},{id:"cross",label:"⚡ Cross-analyse",sub:`${configuredProviders.length} IA`}].map(m=>(
                <div key={m.id} onClick={()=>setAnalysisMode(m.id)}
                  style={{flex:1,padding:"10px 12px",borderRadius:10,background:analysisMode===m.id?`${C.cyan}18`:"transparent",border:`1px solid ${analysisMode===m.id?C.cyan:C.border}`,cursor:"pointer",transition:"all .2s",textAlign:"center"}}>
                  <div style={{fontSize:12,color:analysisMode===m.id?C.cyan:C.muted,fontFamily:"'DM Mono',monospace"}}>{m.label}</div>
                  <div style={{fontSize:9,color:C.muted,marginTop:2}}>{m.sub} · {m.id==="cross"?`${configuredProviders.length} crédit${configuredProviders.length>1?"s":""}`:"1 crédit"}</div>
                </div>
              ))}
            </div>

            {/* Sélection IA (mode simple) */}
            {analysisMode==="single"&&(
              <>
                <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>Fournisseur IA</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  {PROVIDERS.map(p=>{
                    const hasKey=!!apiKeys[p.id]?.trim();
                    const sel=selectedProvider===p.id;
                    return(
                      <div key={p.id} onClick={()=>{ if(hasKey) setSelectedProvider(p.id); else setScreen("settings"); }}
                        style={{padding:"12px",borderRadius:12,background:sel?`${p.color}18`:"#0a1018",border:`1px solid ${sel?p.color:hasKey?p.color+"33":C.border}`,cursor:"pointer",transition:"all .2s",opacity:hasKey?1:0.5}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                          <span style={{fontSize:18}}>{p.icon}</span>
                          <div>
                            <div style={{fontSize:12,color:sel?p.color:C.text,fontFamily:"'Syne',sans-serif",fontWeight:700}}>{p.name}</div>
                            <div style={{fontSize:9,color:C.muted}}>{p.company}</div>
                          </div>
                          {sel&&<div style={{marginLeft:"auto",width:8,height:8,borderRadius:"50%",background:p.color,boxShadow:`0 0 6px ${p.color}`}}/>}
                        </div>
                        {!hasKey&&<div style={{fontSize:9,color:C.orange}}>⚠️ Clé manquante</div>}
                      </div>
                    );
                  })}
                </div>
              </>
            )}

            {/* Cross-analyse : liste des IA */}
            {analysisMode==="cross"&&(
              <div style={{background:"#0a1018",border:`1px solid ${C.cyan}33`,borderRadius:12,padding:"12px 14px"}}>
                <div style={{fontSize:9,color:C.cyan,letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>IA incluses dans la cross-analyse</div>
                {configuredProviders.length<2&&(
                  <div style={{fontSize:11,color:C.orange,marginBottom:8}}>⚠️ Configurez au moins 2 clés API dans <button onClick={()=>setScreen("settings")} style={{background:"none",border:"none",color:C.cyan,cursor:"pointer",fontFamily:"'DM Mono',monospace",fontSize:11,textDecoration:"underline"}}>Paramètres</button></div>
                )}
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {configuredProviders.map(p=>(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:6,background:`${p.color}15`,border:`1px solid ${p.color}44`,borderRadius:20,padding:"5px 10px"}}>
                      <span style={{fontSize:12}}>{p.icon}</span>
                      <span style={{fontSize:10,color:p.color}}>{p.name}</span>
                    </div>
                  ))}
                  {PROVIDERS.filter(p=>!apiKeys[p.id]?.trim()).map(p=>(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:6,background:"#0a1018",border:`1px solid ${C.border}`,borderRadius:20,padding:"5px 10px",opacity:.4}}>
                      <span style={{fontSize:12}}>{p.icon}</span>
                      <span style={{fontSize:10,color:C.muted}}>{p.name}</span>
                    </div>
                  ))}
                </div>
                <button onClick={()=>setScreen("settings")} style={{marginTop:10,background:"none",border:"none",color:C.cyan,cursor:"pointer",fontFamily:"'DM Mono',monospace",fontSize:10,textDecoration:"underline",padding:0}}>+ Ajouter des clés API</button>
              </div>
            )}
          </div>
        )}

        {showHint&&<div style={{background:`${C.cyan}15`,border:`1px solid ${C.cyan}44`,borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:11,color:C.cyan,animation:"fadeUp .3s ease"}}>✅ Texte capturé — prêt à analyser !</div>}

        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,overflow:"hidden",marginBottom:14}}>
          <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:10,color:C.muted,letterSpacing:2}}>TEXTE À ANALYSER</span>
            <span style={{fontSize:10,color:wc>=30?C.green:C.orange}}>{wc} / 30 mots min.</span>
          </div>
          <textarea value={text} onChange={e=>setText(e.target.value)}
            onTouchStart={onTouchStart} onTouchEnd={()=>clearTimeout(longTimer.current)}
            placeholder="Collez ou tapez le texte suspect… (appui long pour capturer une sélection)"
            rows={8} style={{width:"100%",background:"transparent",color:C.text,padding:"16px",fontSize:13,fontFamily:"'DM Mono',monospace",lineHeight:1.7}}/>
          {text&&<button onClick={()=>setText("")} style={{width:"100%",background:"transparent",color:C.muted,padding:"10px",fontSize:11,cursor:"pointer",fontFamily:"'DM Mono',monospace",border:"none",borderTop:`1px solid ${C.border}`}}>✕ Effacer</button>}
        </div>

        {error&&<div style={{background:"#1a0a0a",border:`1px solid ${C.red}44`,borderRadius:10,padding:"12px 14px",marginBottom:14,fontSize:12,color:C.red}}>{error}</div>}

        <button onClick={analyze} disabled={loading||wc<30}
          style={{width:"100%",padding:"18px",borderRadius:14,
            background:loading?"#0d1117":wc>=30?`linear-gradient(135deg,${mode==="premium"?C.cyan:C.green}22,${mode==="premium"?C.cyan:C.green}0a)`:"#0d1117",
            border:`1px solid ${wc>=30?(mode==="premium"?C.cyan:C.green):C.border}`,
            color:wc>=30?(mode==="premium"?C.cyan:C.green):C.muted,
            fontSize:14,fontFamily:"'Syne',sans-serif",fontWeight:700,cursor:wc>=30?"pointer":"not-allowed",letterSpacing:2,transition:"all .2s",
            filter:wc>=30?`drop-shadow(0 0 12px ${mode==="premium"?C.cyan:C.green}44)`:"none"}}>
          {loading
            ?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}><Spinner/> ANALYSE EN COURS…</span>
            :analysisMode==="cross"&&mode==="premium"
              ?`🔀 CROSS-ANALYSE (${configuredProviders.length} IA · ${configuredProviders.length} crédits)`
              :"🔍 ANALYSER LE TEXTE"}
        </button>
        {mode==="premium"&&credits>0&&<div style={{marginTop:10,textAlign:"center",fontSize:10,color:C.muted}}>Cette analyse consommera {analysisMode==="cross"?configuredProviders.length:1} crédit{analysisMode==="cross"&&configuredProviders.length>1?"s":""} · Solde après : {credits-(analysisMode==="cross"?configuredProviders.length:1)}</div>}
      </div>
    </div>
  );

  // ── CROSS RESULTS ───────────────────────────────────────────────────────────
  if(screen==="cross") {
    const results=Object.entries(crossResults).map(([pid,r])=>({ pid, p:PROVIDERS.find(x=>x.id===pid), r }));
    const done=results.filter(({r})=>r&&r!=="loading"&&!r.error);
    const consensus=done.length?Math.round(done.reduce((a,{r})=>a+r.score,0)/done.length):null;
    const agree=done.length>1&&done.every(({r})=>(r.score<50&&consensus<50)||(r.score>=50&&consensus>=50));
    return(
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px 80px",fontFamily:"'DM Mono',monospace"}}>
        <style>{FONTS}{G}</style>
        <div style={{width:"100%",maxWidth:440,paddingTop:48,animation:"fadeUp .5s ease"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
            <BackBtn onClick={()=>setScreen("analyze")}/>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:700,color:C.cyan}}>⚡ Cross-analyse</div>
            {credits>0&&cp&&<div style={{marginLeft:"auto",fontSize:10,color:cp.color}}>{credits} cr. restant{credits>1?"s":""}</div>}
          </div>

          {/* Consensus */}
          {consensus!==null&&(
            <div style={{background:C.card,border:`1px solid ${scoreColor(consensus)}33`,borderRadius:20,padding:"24px",marginBottom:14,textAlign:"center",boxShadow:`0 0 40px ${scoreColor(consensus)}11`,animation:"popIn .4s ease"}}>
              <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>Score consensus ({done.length} IA)</div>
              <ScoreArc score={consensus}/>
              <div style={{marginTop:8,fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,color:scoreColor(consensus)}}>{scoreEmoji(consensus)} {scoreLabel(consensus)}</div>
              <div style={{marginTop:8,fontSize:11,color:agree?C.green:C.yellow}}>{agree?"✅ Les IA sont en accord":"⚠️ Les IA divergent sur ce texte"}</div>
            </div>
          )}

          {/* Résultats individuels */}
          {results.map(({pid,p,r},i)=>(
            <div key={pid} style={{background:C.card,border:`1px solid ${p?.color||C.border}33`,borderRadius:16,padding:"18px",marginBottom:10,animation:`fadeUp ${.3+i*.1}s ease`}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:r==="loading"?0:14}}>
                <div style={{width:36,height:36,borderRadius:10,background:`${p?.color||C.muted}18`,border:`1px solid ${p?.color||C.muted}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{p?.icon||"?"}</div>
                <div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:700,color:p?.color||C.text}}>{p?.name}</div>
                  <div style={{fontSize:9,color:C.muted}}>{p?.company}</div>
                </div>
                {r==="loading"&&<div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}><Spinner color={p?.color}/><span style={{fontSize:10,color:C.muted}}>Analyse…</span></div>}
                {r?.error&&<div style={{marginLeft:"auto",fontSize:10,color:C.red}}>❌ Erreur</div>}
                {r&&r!=="loading"&&!r.error&&<div style={{marginLeft:"auto",fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,color:scoreColor(r.score)}}>{r.score}%</div>}
              </div>
              {r&&r!=="loading"&&!r.error&&(
                <>
                  <div style={{height:6,background:"#0a1117",borderRadius:3,overflow:"hidden",marginBottom:10}}>
                    <div style={{height:"100%",width:`${r.score}%`,background:scoreColor(r.score),borderRadius:3,transition:"width .8s ease",boxShadow:`0 0 6px ${scoreColor(r.score)}88`}}/>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    <div style={{fontSize:10,color:C.dim}}><span style={{color:C.muted,fontSize:9}}>VERDICT </span><span style={{color:scoreColor(r.score)}}>{r.verdict}</span></div>
                    <div style={{fontSize:10,color:C.dim}}><span style={{color:C.muted,fontSize:9}}>IA PROBABLE </span><span style={{color:C.text}}>{r.ai_probable}</span></div>
                  </div>
                  {r.probable_prompt&&<div style={{marginTop:8,fontSize:10,color:C.muted,fontStyle:"italic",borderTop:`1px solid ${C.border}`,paddingTop:8}}>"{r.probable_prompt}"</div>}
                </>
              )}
            </div>
          ))}

          <button onClick={()=>{ setScreen("analyze"); setCrossResults({}); setText(""); setError(""); }}
            style={{width:"100%",padding:"14px",borderRadius:12,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"'DM Mono',monospace",marginTop:6}}>
            ↺ Nouvelle analyse
          </button>
        </div>
      </div>
    );
  }

  // ── RESULT (single) ─────────────────────────────────────────────────────────
  if(screen==="result"&&result) return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px 80px",fontFamily:"'DM Mono',monospace"}}>
      <style>{FONTS}{G}</style>
      <div style={{width:"100%",maxWidth:440,paddingTop:48,animation:"fadeUp .5s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
          <BackBtn onClick={()=>setScreen("analyze")}/>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:700,color:C.text}}>Résultats</div>
          {providerInfo&&<div style={{display:"flex",alignItems:"center",gap:6,background:`${providerInfo.color}18`,border:`1px solid ${providerInfo.color}44`,borderRadius:20,padding:"4px 10px",marginLeft:"auto"}}>
            <span>{providerInfo.icon}</span><span style={{fontSize:10,color:providerInfo.color}}>{providerInfo.name}</span>
          </div>}
        </div>

        <div style={{background:C.card,border:`1px solid ${col}33`,borderRadius:20,padding:"28px 24px",marginBottom:14,textAlign:"center",boxShadow:`0 0 40px ${col}11`}}>
          <ScoreArc score={result.score}/>
          <div style={{marginTop:8,fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800,color:col}}>{scoreEmoji(result.score)} {result.verdict}</div>
          <div style={{fontSize:10,color:C.muted,marginTop:6,letterSpacing:2}}>{mode==="premium"?"ANALYSE IA · HAUTE PRÉCISION":"ANALYSE HEURISTIQUE · GRATUIT"}</div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <Bdg label="IA probable" value={result.ai_probable} color={result.score>40?C.orange:C.green}/>
          <Bdg label="Confiance ID" value={result.score>40?`${result.ai_confidence}%`:"—"} color={C.cyan}/>
          <Bdg label="Langue" value={result.language} color={C.cyan}/>
          <Bdg label="Analysé par" value={providerInfo?`${providerInfo.icon} ${providerInfo.name}`:"Heuristique"} color={providerInfo?.color||C.green}/>
        </div>

        {result.probable_prompt&&(
          <div style={{background:"#0a1018",border:`1px solid ${C.cyan}33`,borderRadius:14,padding:"16px",marginBottom:14}}>
            <div style={{fontSize:9,color:C.cyan,letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>🧠 Prompt probable reconstruit</div>
            <div style={{fontSize:12,color:C.text,lineHeight:1.7,fontStyle:"italic"}}>"{result.probable_prompt}"</div>
          </div>
        )}

        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px",marginBottom:14}}>
          <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:12,textTransform:"uppercase"}}>📋 Indices analysés</div>
          {result.indices?.map((ind,i)=>(
            <div key={i} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}>
              <span style={{color:col,fontSize:8,marginTop:4,flexShrink:0}}>■</span>
              <span style={{fontSize:11,color:C.dim,lineHeight:1.6}}>{ind}</span>
            </div>
          ))}
        </div>

        {result.style_markers?.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>{result.style_markers.map((m,i)=><span key={i} style={{background:"#0a1420",border:`1px solid ${C.border}`,borderRadius:20,padding:"5px 12px",fontSize:10,color:C.muted}}>{m}</span>)}</div>}

        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:"20px",marginBottom:14}}>
          <div style={{fontSize:10,color:C.star,letterSpacing:2,marginBottom:14,textTransform:"uppercase"}}>⭐ Notez cette analyse</div>
          <Stars value={rating} onChange={setRating}/>
          {rating>0&&(
            <div style={{marginTop:14,animation:"fadeUp .3s ease"}}>
              <textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Remarques (optionnel)…" rows={3}
                style={{width:"100%",background:"#07090f",color:C.text,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px",fontSize:12,fontFamily:"'DM Mono',monospace",lineHeight:1.6}}/>
              <button onClick={saveFeedback} style={{width:"100%",marginTop:10,padding:"14px",background:`${C.star}15`,border:`1px solid ${C.star}44`,color:C.star,borderRadius:10,fontSize:12,cursor:"pointer",fontFamily:"'Syne',sans-serif",fontWeight:700,letterSpacing:1}}>✓ ENVOYER MON AVIS</button>
            </div>
          )}
        </div>

        <div style={{display:"grid",gridTemplateColumns:credits<=1&&mode==="premium"?"1fr 1fr":"1fr",gap:10}}>
          <button onClick={()=>{ setScreen("analyze"); setResult(null); setText(""); setError(""); }}
            style={{padding:"14px",borderRadius:12,background:"transparent",border:`1px solid ${C.border}`,color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>
            ↺ Nouvelle analyse
          </button>
          {credits<=1&&mode==="premium"&&(
            <button onClick={()=>setScreen("pricing")} style={{padding:"14px",borderRadius:12,background:`${C.cyan}18`,border:`1px solid ${C.cyan}44`,color:C.cyan,fontSize:12,cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>💳 Recharger</button>
          )}
        </div>
      </div>
    </div>
  );

  // ── PRICING ──────────────────────────────────────────────────────────────────
  if(screen==="pricing") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px 80px",fontFamily:"'DM Mono',monospace"}}>
      <style>{FONTS}{G}</style>
      <div style={{width:"100%",maxWidth:440,paddingTop:48,animation:"fadeUp .5s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}><BackBtn onClick={()=>setScreen("home")}/><div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:700,color:C.text}}>Choisir un forfait</div></div>
        <div style={{fontSize:11,color:C.muted,marginBottom:22,marginTop:8,lineHeight:1.6}}>Chaque analyse = 1 crédit. La cross-analyse = 1 crédit par IA configurée.</div>
        {buySuccess?(
          <div style={{background:`${C.green}15`,border:`1px solid ${C.green}44`,borderRadius:16,padding:"48px 20px",textAlign:"center",animation:"popIn .4s ease"}}>
            <div style={{fontSize:52,marginBottom:14}}>✅</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,color:C.green,marginBottom:8}}>Forfait activé !</div>
            <div style={{fontSize:12,color:C.dim}}>Redirection…</div>
          </div>
        ):(
          <>
            {PLANS.map((p,i)=>(
              <div key={p.id} onClick={()=>buyPlan(p)}
                style={{background:C.card,border:`1px solid ${p.color}55`,borderRadius:16,padding:"20px",marginBottom:12,cursor:"pointer",position:"relative",animation:`fadeUp ${.3+i*.08}s ease`,transition:"transform .15s,box-shadow .15s"}}
                onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 8px 28px ${p.color}22`}}
                onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="none"}}>
                {p.badge&&<div style={{position:"absolute",top:14,right:14,background:p.color,color:"#07090f",fontSize:9,fontWeight:700,padding:"3px 10px",borderRadius:20,fontFamily:"'Syne',sans-serif"}}>{p.badge}</div>}
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:48,height:48,borderRadius:12,background:`${p.color}18`,border:`1px solid ${p.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{p.icon}</div>
                  <div style={{flex:1}}><div style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:700,color:p.color,marginBottom:2}}>{p.label}</div><div style={{fontSize:10,color:C.dim}}>{p.sub}</div></div>
                  <div style={{textAlign:"right",paddingRight:p.badge?32:0}}><div style={{fontFamily:"'Syne',sans-serif",fontSize:24,fontWeight:800,color:C.text}}>{p.price}</div><div style={{fontSize:10,color:p.color,marginTop:2}}>{p.unlimited?"♾️ Illimité":`${p.credits} crédit${p.credits>1?"s":""}`}</div></div>
                </div>
              </div>
            ))}
            <div style={{background:"#0a1018",border:`1px solid ${C.border}`,borderRadius:14,padding:"18px",marginTop:4,marginBottom:14}}>
              <div style={{fontSize:9,color:C.muted,letterSpacing:2,marginBottom:14,textTransform:"uppercase"}}>📊 Prix par analyse</div>
              {[["À l'unité","1,99€",null],["Pack 10","0,40€","−80%"],["Mensuel 200","0,050€","−97%"],["Mensuel 500","0,040€","−98%"],["Illimité","∞","100%"]].map(([l,p,s],i,a)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<a.length-1?`1px solid ${C.border}`:"none"}}>
                  <span style={{fontSize:12,color:C.dim}}>{l}</span>
                  <div style={{display:"flex",gap:10,alignItems:"center"}}>
                    <span style={{fontSize:13,color:C.text,fontFamily:"'Syne',sans-serif",fontWeight:700}}>{p}</span>
                    {s&&<span style={{fontSize:9,background:`${C.green}18`,color:C.green,padding:"3px 8px",borderRadius:10,fontFamily:"'Syne',sans-serif",fontWeight:700}}>{s}</span>}
                  </div>
                </div>
              ))}
            </div>
            <div style={{fontSize:10,color:C.muted,lineHeight:1.8,textAlign:"center"}}>🔒 Paiement sécurisé · Stripe<br/>Résiliation abonnements à tout moment</div>
          </>
        )}
      </div>
    </div>
  );

  // ── HISTORY ──────────────────────────────────────────────────────────────────
  if(screen==="history") return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px 80px",fontFamily:"'DM Mono',monospace"}}>
      <style>{FONTS}{G}</style>
      <div style={{width:"100%",maxWidth:440,paddingTop:48,animation:"fadeUp .5s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}><BackBtn onClick={()=>setScreen("home")}/><div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:700,color:C.text}}>Historique & Avis</div></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
          {[{v:feedbacks.length,l:"Analyses",col:C.cyan},
            {v:feedbacks.length?(feedbacks.reduce((a,b)=>a+b.rating,0)/feedbacks.length).toFixed(1)+"★":"—",l:"Note moy.",col:C.star},
            {v:feedbacks.length?Math.round(feedbacks.reduce((a,b)=>a+b.score,0)/feedbacks.length)+"%":"—",l:"Score moy.",col:C.orange}
          ].map((s,i)=>(
            <div key={i} style={{background:C.card,border:`1px solid ${s.col}33`,borderRadius:12,padding:"12px",textAlign:"center"}}>
              <div style={{fontSize:20,fontFamily:"'Syne',sans-serif",fontWeight:800,color:s.col}}>{s.v}</div>
              <div style={{fontSize:9,color:C.muted,marginTop:3}}>{s.l}</div>
            </div>
          ))}
        </div>
        {feedbacks.map((f,i)=>{
          const prov=PROVIDERS.find(p=>p.id===f.provider);
          return(
            <div key={f.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px",marginBottom:10,animation:`fadeUp ${.3+i*.05}s ease`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{fontSize:10,color:C.muted}}>{f.date}</span>
                <span style={{fontSize:10,color:prov?.color||C.green}}>{prov?`${prov.icon} ${prov.name}`:"🆓 Gratuit"}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:700,color:scoreColor(f.score)}}>{f.score}% — {f.verdict}</span>
                <span style={{fontSize:12,color:C.star}}>{"★".repeat(f.rating)}<span style={{color:C.muted,fontSize:10}}> {f.rating}/5</span></span>
              </div>
              <div style={{fontSize:11,color:C.dim,marginBottom:f.comment?8:0}}>{f.ai}</div>
              {f.comment&&<div style={{fontSize:11,color:C.muted,fontStyle:"italic",borderTop:`1px solid ${C.border}`,paddingTop:8,marginTop:4}}>"{f.comment}"</div>}
            </div>
          );
        })}
        {feedbacks.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:C.muted,fontSize:13}}>Aucun historique</div>}
      </div>
    </div>
  );

  return null;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Detectia/>);
  </script>
</body>
</html>
